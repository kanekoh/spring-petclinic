# Default datasource (H2 in-memory)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;MODE=LEGACY
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM - schema managed by Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.fetch.batch-size=16
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway - H2 migrations (default profile)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# HTTP
quarkus.http.static-resources.max-age=43200

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.quarkus".level=INFO

# Health endpoint
quarkus.smallrye-health.root-path=/actuator/health

# MySQL profile
%mysql.quarkus.datasource.db-kind=mysql
%mysql.quarkus.datasource.jdbc.url=${MYSQL_URL:jdbc:mysql://localhost/petclinic}
%mysql.quarkus.datasource.username=${MYSQL_USER:petclinic}
%mysql.quarkus.datasource.password=${MYSQL_PASS:petclinic}
%mysql.quarkus.hibernate-orm.database.generation=none
%mysql.quarkus.hibernate-orm.sql-load-script=no-file
%mysql.quarkus.flyway.enabled=false

# PostgreSQL profile
%postgres.quarkus.datasource.db-kind=postgresql
%postgres.quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
%postgres.quarkus.datasource.username=${POSTGRES_USER:petclinic}
%postgres.quarkus.datasource.password=${POSTGRES_PASS:petclinic}
%postgres.quarkus.hibernate-orm.database.generation=none
%postgres.quarkus.hibernate-orm.sql-load-script=no-file
%postgres.quarkus.flyway.enabled=false
