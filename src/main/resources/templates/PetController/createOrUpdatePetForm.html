{#include layout.html}
<h2>
  {#if pet.new}New {/if}
  Pet
</h2>

{#if errors.size() > 0}
<div class="alert alert-danger">
  {#for err in errors}
  <p>{err}</p>
  {/for}
</div>
{/if}

<form class="form-horizontal" method="post">
  <input type="hidden" name="id" value="{pet.id}" />
  <div class="form-group has-feedback">
    <div class="form-group">
      <label class="col-sm-2 control-label">Owner</label>
      <div class="col-sm-10">
        <span>{owner.firstName} {owner.lastName}</span>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">Name</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" name="name" value="{pet.name}" />
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">Birth Date</label>
      <div class="col-sm-10">
        <input class="form-control" type="date" name="birthDate" value="{pet.birthDate}" />
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">Type</label>
      <div class="col-sm-10">
        <select name="type">
          {#for type in types}
          <option value="{type.name}">{type.name}</option>
          {/for}
        </select>
      </div>
    </div>
  </div>
  <div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
      {#if pet.new}
      <button class="btn btn-primary" type="submit">Add Pet</button>
      {#else}
      <button class="btn btn-primary" type="submit">Update Pet</button>
      {/if}
    </div>
  </div>
</form>
{/include}
